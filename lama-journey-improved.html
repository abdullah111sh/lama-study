<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لمى 🤍</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fffafc;
      color: #5d5360;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(120, 90, 110, 0.08);
      border: 1px solid #f3e7ed;
    }

    .heart {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: #8d7180;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 10px;
      color: #a4959d;
      font-size: 16px;
      line-height: 1.8;
    }

    .study-box {
      margin-top: 28px;
      padding: 22px;
      background: #fff5f8;
      border-radius: 20px;
      border: 1px solid #f5e3ea;
    }

    .study-box h2 {
      margin-top: 0;
      color: #806675;
      font-size: 21px;
    }

    .check-button {
      border: none;
      background: #e8c8d5;
      color: #604d58;
      padding: 15px 28px;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .check-button:hover {
      transform: translateY(-2px);
      background: #dfbdcb;
    }

    .check-button:active {
      transform: scale(0.97);
    }

    #message {
      margin-top: 20px;
      min-height: 55px;
      font-size: 18px;
      line-height: 1.8;
      color: #806675;
    }

    .streak {
      margin-top: 20px;
      padding: 15px;
      border-radius: 18px;
      background: #faf4f7;
      font-size: 17px;
    }

    .footer {
      margin-top: 28px;
      color: #b09da6;
      font-size: 14px;
    }

    .small-heart {
      color: #d99caf;
    }

    .reset {
      margin-top: 15px;
      border: none;
      background: transparent;
      color: #b39da7;
      cursor: pointer;
      font-size: 13px;
    }

    .reset:hover {
      color: #8d7180;
    }


    /* =========================
       الإضافة الأولى: النجوم ✨
       ========================= */

    .star {
      position: fixed;
      top: -50px;
      z-index: 9999;
      pointer-events: none;
      animation: starFall linear forwards;
    }

    @keyframes starFall {
      0% {
        transform: translateY(-10vh) rotate(0deg) scale(0.4);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateY(115vh) rotate(720deg) scale(1.2);
        opacity: 0;
      }
    }


    /* =========================
       الإضافة الثانية: المهام 📝
       ========================= */

    .tasks-box {
      margin-top: 20px;
      padding: 22px;
      background: #fff8fa;
      border-radius: 20px;
      border: 1px solid #f5e3ea;
    }

    .tasks-box h2 {
      margin-top: 0;
      color: #806675;
      font-size: 21px;
    }

    .task-input-area {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .task-input {
      flex: 1;
      border: 1px solid #ead9e0;
      background: white;
      padding: 13px 15px;
      border-radius: 15px;
      outline: none;
      font-size: 15px;
      color: #604d58;
    }

    .task-input:focus {
      border-color: #d8b4c3;
    }

    .task-input::placeholder {
      color: #b8a5ae;
    }

    .add-task-button {
      border: none;
      background: #e8c8d5;
      color: #604d58;
      border-radius: 15px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
      font-size: 17px;
    }

    .add-task-button:hover {
      background: #dfbdcb;
    }

    .tasks-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .task-item {
      background: white;
      border: 1px solid #f0e3e8;
      border-radius: 15px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #d6aabc;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      color: #6d5963;
      font-size: 15px;
      line-height: 1.5;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .delete-task {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      opacity: 0.55;
    }

    .delete-task:hover {
      opacity: 1;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="heart">♡</div>

    <h1>لمى 🤍</h1>

    <p class="subtitle">
      مكان صغير عشان تذكّرين نفسك كل يوم<br>
      إنك قاعدة تتقدمين خطوة خطوة 🌷
    </p>

    <div class="study-box">

      <h2>هل ذاكرتِ قدرات اليوم؟ 📚</h2>

      <button class="check-button" onclick="finishedStudy()">
        ✓ ذاكرت اليوم
      </button>

      <div id="message"></div>

    </div>

    <div class="streak">
      🔖 عدد الأيام اللي ذاكرتِ فيها:
      <strong id="days">0</strong>
    </div>


    <!-- =========================
         الإضافة: خانة المهام 📝
         ========================= -->

    <div class="tasks-box">

      <h2>مهامك اليوم يا لمى 📝🤍</h2>

      <div class="task-input-area">

        <input
          id="taskInput"
          class="task-input"
          type="text"
          placeholder="اكتبي مهامك هُنا يا ملكة 👑"
        >

        <button
          class="add-task-button"
          onclick="addTask()"
        >
          +
        </button>

      </div>

      <div
        id="tasksList"
        class="tasks-list"
      ></div>

    </div>


    <div class="footer">
      صنع بحب من عبدالله إلى لمى
      <span class="small-heart">♡</span> 🍼
    </div>

    <button class="reset" onclick="resetProgress()">
      تصفير العداد
    </button>

  </div>


  <script>

    let days = Number(localStorage.getItem("lamaStudyDays")) || 0;
    let lastStudyDate = localStorage.getItem("lamaLastStudyDate");

    document.getElementById("days").textContent = days;

    function getToday() {
      const now = new Date();

      return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
    }

    function finishedStudy() {

      const today = getToday();

      if (lastStudyDate === today) {

        document.getElementById("message").innerHTML =
          "أنتِ حسبتي مذاكرة اليوم خلاص 🤍<br>" +
          "باقي بس تستمرين على نفس الحماس 🌷";

        return;
      }

      days++;

      lastStudyDate = today;

      localStorage.setItem("lamaStudyDays", days);
      localStorage.setItem("lamaLastStudyDate", today);

      document.getElementById("days").textContent = days;

      const messages = [
        "أحسنتِ يا لمى 🤍 خطوة صغيرة اليوم، وبتصيرين أقرب لهدفك.",
        "فخورة فيكِ 🌷 لا تستهينين بأي يوم تذاكرين فيه.",
        "كذا يا لمى! 📚🤍 استمري، تعبك اليوم بيصنع فرق بكرة.",
        "برافو عليكِ ♡ يوم جديد أنجزتيه!",
        "قدها لمى 🫶🏻 خطوة خطوة لين توصلين.",
        "أهم شيء الاستمرار، وأنتِ قاعدة تسوينها 🤍",
        "ذاكرتِ؟ خلاص تستاهلين تفخرين بنفسك اليوم 🌸"
      ];

      const randomMessage =
        messages[Math.floor(Math.random() * messages.length)];

      document.getElementById("message").innerHTML =
        randomMessage;
    }


    function resetProgress() {

      const confirmReset =
        confirm("متأكدة تبين تصفرين العداد؟");

      if (confirmReset) {

        days = 0;
        lastStudyDate = null;

        localStorage.removeItem("lamaStudyDays");
        localStorage.removeItem("lamaLastStudyDate");

        document.getElementById("days").textContent = 0;

        document.getElementById("message").innerHTML =
          "تم تصفير العداد 🤍";
      }
    }

  </script>


  <!-- =====================================
       إضافات جديدة فقط - النجوم والمهام
       ===================================== -->

  <script>

    /* النجوم */

    let studyDateBeforeClick = null;

    const studyButton =
      document.querySelector(".check-button");


    studyButton.addEventListener(
      "click",
      function () {

        studyDateBeforeClick =
          localStorage.getItem("lamaLastStudyDate");

      },
      true
    );


    studyButton.addEventListener(
      "click",
      function () {

        const studyDateAfterClick =
          localStorage.getItem("lamaLastStudyDate");

        /*
          نشغّل النجوم فقط إذا انحسب
          يوم جديد فعلاً
        */

        if (
          studyDateBeforeClick !== studyDateAfterClick &&
          studyDateAfterClick === getToday()
        ) {

          createStars();

        }

      }
    );


    function createStars() {

      const stars =
        ["✨", "⭐", "🌟", "✦", "✧", "💫"];

      for (let i = 0; i < 100; i++) {

        const star =
          document.createElement("div");

        star.className = "star";

        star.textContent =
          stars[
            Math.floor(
              Math.random() * stars.length
            )
          ];

        star.style.left =
          Math.random() * 100 + "vw";

        star.style.fontSize =
          15 + Math.random() * 30 + "px";

        star.style.animationDuration =
          2 + Math.random() * 3 + "s";

        star.style.animationDelay =
          Math.random() * 0.8 + "s";

        document.body.appendChild(star);


        setTimeout(
          function () {
            star.remove();
          },
          6000
        );

      }

    }



    /* =========================
       المهام
       ========================= */

    let tasks =
      JSON.parse(
        localStorage.getItem("lamaTasks")
      ) || [];


    function saveTasks() {

      localStorage.setItem(
        "lamaTasks",
        JSON.stringify(tasks)
      );

    }


    function renderTasks() {

      const tasksList =
        document.getElementById("tasksList");

      tasksList.innerHTML = "";


      tasks.forEach(
        function (task, index) {

          const item =
            document.createElement("div");

          item.className =
            "task-item" +
            (task.done ? " done" : "");


          const checkbox =
            document.createElement("input");

          checkbox.type = "checkbox";
          checkbox.checked = task.done;

          checkbox.addEventListener(
            "change",
            function () {

              tasks[index].done =
                checkbox.checked;

              saveTasks();
              renderTasks();

            }
          );


          const text =
            document.createElement("div");

          text.className = "task-text";
          text.textContent = task.text;


          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "delete-task";

          deleteButton.textContent = "✕";

          deleteButton.onclick =
            function () {

              tasks.splice(index, 1);

              saveTasks();
              renderTasks();

            };


          item.appendChild(checkbox);
          item.appendChild(text);
          item.appendChild(deleteButton);

          tasksList.appendChild(item);

        }
      );

    }


    function addTask() {

      const input =
        document.getElementById("taskInput");

      const taskText =
        input.value.trim();


      if (taskText === "") {
        return;
      }


      tasks.push({
        text: taskText,
        done: false
      });


      saveTasks();
      renderTasks();

      input.value = "";

      input.focus();

    }


    document
      .getElementById("taskInput")
      .addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {

            addTask();

          }

        }
      );


    renderTasks();

  </script>

</body>
</html>
